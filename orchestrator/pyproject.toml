[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]
